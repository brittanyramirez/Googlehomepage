  <title>Google Project</title>
  <link rel="stylesheet" href="style.css" />
   <script src="google.js" defer></script>
</head>
<body>
  <!-- Header; this is my nav bar-->

  <!-- Main Content-->

<!-- this is forming the search bar-->
